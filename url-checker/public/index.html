<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Inspect URL metadata with an optional AI explanation.">
  <title>AI URL Safety Checker</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="wrap">
    <header>
      <p class="eyebrow">URL METADATA TOOL</p>
      <h1>Check a link before you open it</h1>
      <p class="intro">Review basic URL signals and get an optional Gemini explanation.</p>
    </header>
    <section class="card">
      <form id="checker-form">
        <label for="url">Website URL</label>
        <div class="row">
          <input id="url" name="url" type="url" placeholder="https://example.com" required maxlength="2048" autocomplete="url">
          <button type="submit">Analyze</button>
        </div>
      </form>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <section id="results" class="results" hidden aria-live="polite">
        <h2>URL details</h2>
        <dl id="details" class="details"></dl>
        <h2>Gemini summary</h2>
        <p id="summary" class="summary"></p>
        <p id="note" class="note"></p>
      </section>
    </section>
    <footer>This tool parses metadata only. It does not open links, follow redirects, or bypass access controls. AI output is not a guarantee of safety.</footer>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
